<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vínculo — Painel dos Fundadores</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --borda:#dcdce2; --texto:#1c1c1e;
    --suave:#6b6b73; --acento:#b03a56; --ok:#137a3d;
    --aviso:#8a6d1f; --erro:#b02a2a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto);font-size:14px}
  header{background:#1a0810;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{margin:0;font-size:17px;font-weight:600}
  header .quem{font-size:12.5px;opacity:.8}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:18px;margin-bottom:18px}
  .card h2{margin:0 0 14px;font-size:15px;font-weight:600}
  label{display:block;font-size:12.5px;color:var(--suave);margin-bottom:4px}
  input{width:100%;padding:9px 10px;border:1px solid var(--borda);border-radius:7px;font-size:14px;font-family:inherit;background:#fff}
  button{padding:9px 14px;border:none;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-primario{background:var(--acento);color:#fff}
  .btn-secundario{background:#e8e8ec;color:var(--texto)}
  button:disabled{opacity:.5;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--borda);vertical-align:middle}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);font-weight:600}
  tbody tr:hover{background:#fafafa}
  .vazio{padding:22px;text-align:center;color:var(--suave);font-size:13px}
  .destaque{background:#1a0810;color:#fff;border-radius:10px;padding:16px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .destaque .valor{font-size:26px;font-weight:700}
  .destaque .rot{font-size:12.5px;opacity:.85}
  .generos{display:flex;gap:14px;flex-wrap:wrap}
  .generos .bloco{flex:1;min-width:140px;background:#fafafa;border:1px solid var(--borda);border-radius:8px;padding:14px;text-align:center}
  .generos .bloco .valor{font-size:22px;font-weight:700;color:var(--acento)}
  .generos .bloco .rot{font-size:12px;color:var(--suave);margin-top:4px}
  .msg{padding:10px 12px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
  .msg-erro{background:#fbe0e0;color:#8f2020;display:block}
  .msg-ok{background:#dff3e6;color:#0f5f2f;display:block}
  #telaLogin{max-width:360px;margin:70px auto}
  #painel{display:none}
  .linha-form{margin-bottom:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="telaLogin">
  <div class="card">
    <h2>Painel dos Fundadores — acesso restrito</h2>
    <div class="msg" id="loginMsg"></div>
    <div class="linha-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username"/>
    </div>
    <div class="linha-form">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password"/>
    </div>
    <button class="btn-primario" style="width:100%" onclick="fazerLogin()" id="btnLogin">Entrar</button>
  </div>
</div>

<!-- ===================== PAINEL ===================== -->
<div id="painel">
  <header>
    <h1>Vínculo · Comunidade de Fundadores</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="quem" id="quemSou"></span>
      <button class="btn-secundario btn-mini" onclick="sair()">Sair</button>
    </div>
  </header>

  <main>
    <div class="msg" id="painelMsg"></div>

    <div class="destaque">
      <div>
        <div class="rot">Total de cadastros</div>
        <div class="valor" id="totalCadastros">0</div>
      </div>
      <div style="margin-left:auto">
        <button class="btn-secundario" onclick="carregarTudo()">Atualizar</button>
      </div>
    </div>

    <div class="card">
      <h2>Divisão por gênero</h2>
      <div class="generos" id="blocoGeneros"></div>
    </div>

    <div class="card">
      <h2>Quem mais indicou</h2>
      <div id="tabelaIndicadores"><div class="vazio">Carregando...</div></div>
    </div>

    <div class="card">
      <h2>Todos os cadastros</h2>
      <div id="tabelaLista"><div class="vazio">Carregando...</div></div>
    </div>
  </main>
</div>

<script>
const API_URL = window.location.origin;
let token = localStorage.getItem('vinculo_admin_token') || null;

function esc(t){
  const d = document.createElement('div');
  d.textContent = t == null ? '' : String(t);
  return d.innerHTML;
}
function dataBR(d){
  if(!d) return '—';
  const dt = new Date(d);
  return isNaN(dt) ? '—' : dt.toLocaleDateString('pt-BR');
}
function mostrarMsg(id, texto, tipo){
  const el = document.getElementById(id);
  el.className = 'msg ' + (tipo === 'ok' ? 'msg-ok' : 'msg-erro');
  el.textContent = texto;
  if(tipo === 'ok') setTimeout(()=>{ el.className = 'msg'; }, 4000);
}

async function api(caminho, opcoes){
  const cfg = Object.assign({ headers: {} }, opcoes || {});
  cfg.headers['Authorization'] = 'Bearer ' + token;
  if(cfg.body){ cfg.headers['Content-Type'] = 'application/json'; }
  const resp = await fetch(API_URL + caminho, cfg);
  const dados = await resp.json().catch(()=>({}));
  if(resp.status === 401 || resp.status === 403){
    sair(dados.erro || 'Acesso negado. Faça login com uma conta administradora.');
    throw new Error(dados.erro || 'Acesso negado');
  }
  if(!resp.ok) throw new Error(dados.erro || 'Erro na requisição');
  return dados;
}

// ===================== LOGIN =====================
async function fazerLogin(){
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btnLogin');
  if(!email || !senha){ mostrarMsg('loginMsg', 'Preencha e-mail e senha.', 'erro'); return; }

  btn.disabled = true;
  btn.textContent = 'Entrando...';
  try{
    const resp = await fetch(API_URL + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const dados = await resp.json();
    if(!resp.ok) throw new Error(dados.erro || 'Falha no login');

    // A checagem de admin acontece aqui só pra dar uma mensagem clara. A
    // proteção de verdade é no backend (verificarAdmin em toda rota /api/admin).
    if(!dados.usuario || !dados.usuario.is_admin){
      mostrarMsg('loginMsg', 'Acesso negado: esta conta não é administradora.', 'erro');
      return;
    }

    token = dados.token;
    localStorage.setItem('vinculo_admin_token', token);
    document.getElementById('quemSou').textContent = dados.usuario.nome || dados.usuario.email;
    mostrarPainel();
  }catch(e){
    mostrarMsg('loginMsg', e.message || 'Falha no login', 'erro');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function sair(msg){
  token = null;
  localStorage.removeItem('vinculo_admin_token');
  document.getElementById('painel').style.display = 'none';
  document.getElementById('telaLogin').style.display = 'block';
  if(msg) mostrarMsg('loginMsg', msg, 'erro');
}

function mostrarPainel(){
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
  carregarTudo();
}

// ===================== PAINEL =====================
async function carregarTudo(){
  try{
    const dados = await api('/api/admin/fundadores');

    document.getElementById('totalCadastros').textContent = dados.total;

    const rotulos = { masculino: 'Homens', feminino: 'Mulheres', 'nao-binario': 'Não-binário' };
    const blocoGeneros = document.getElementById('blocoGeneros');
    blocoGeneros.innerHTML = Object.keys(rotulos).map(chave => `
      <div class="bloco">
        <div class="valor">${esc(dados.por_genero[chave] || 0)}</div>
        <div class="rot">${esc(rotulos[chave])}</div>
      </div>
    `).join('');

    const tabelaIndicadores = document.getElementById('tabelaIndicadores');
    if(!dados.top_indicadores.length){
      tabelaIndicadores.innerHTML = '<div class="vazio">Ninguém indicou mais ninguém ainda.</div>';
    }else{
      tabelaIndicadores.innerHTML = `
        <table>
          <thead><tr><th>Nome</th><th>Código</th><th>Indicações</th></tr></thead>
          <tbody>
            ${dados.top_indicadores.map(i => `
              <tr>
                <td>${esc(i.nome)}</td>
                <td class="mono">${esc(i.codigo_proprio)}</td>
                <td>${esc(i.total_indicados)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    const tabelaLista = document.getElementById('tabelaLista');
    if(!dados.lista.length){
      tabelaLista.innerHTML = '<div class="vazio">Nenhum cadastro ainda.</div>';
    }else{
      tabelaLista.innerHTML = `
        <table>
          <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Gênero</th><th>Indicado por</th><th>Data</th></tr></thead>
          <tbody>
            ${dados.lista.map(f => `
              <tr>
                <td>${esc(f.nome)}</td>
                <td>${esc(f.email)}</td>
                <td>${esc(f.telefone)}</td>
                <td>${esc(rotulos[f.genero] || f.genero)}</td>
                <td class="mono">${esc(f.codigo_indicador || '—')}</td>
                <td>${dataBR(f.data_cadastro)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
  }catch(e){
    mostrarMsg('painelMsg', e.message || 'Erro ao carregar dados', 'erro');
  }
}

if(token){
  mostrarPainel();
}
</script>
</body>
</html>
