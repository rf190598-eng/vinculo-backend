<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vínculo — Painel de Parceiros</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --borda:#dcdce2; --texto:#1c1c1e;
    --suave:#6b6b73; --acento:#b03a56; --ok:#137a3d;
    --aviso:#8a6d1f; --erro:#b02a2a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto);font-size:14px}
  header{background:#1a0810;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{margin:0;font-size:17px;font-weight:600}
  header .quem{font-size:12.5px;opacity:.8}
  main{max-width:1200px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:18px;margin-bottom:18px}
  .card h2{margin:0 0 14px;font-size:15px;font-weight:600}
  label{display:block;font-size:12.5px;color:var(--suave);margin-bottom:4px}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--borda);border-radius:7px;font-size:14px;font-family:inherit;background:#fff}
  button{padding:9px 14px;border:none;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-primario{background:var(--acento);color:#fff}
  .btn-secundario{background:#e8e8ec;color:var(--texto)}
  .btn-ok{background:#137a3d;color:#fff}
  .btn-perigo{background:#b02a2a;color:#fff}
  .btn-mini{padding:5px 10px;font-size:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--borda);vertical-align:middle}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);font-weight:600}
  tbody tr:hover{background:#fafafa}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
  .tag-ativo{background:#dff3e6;color:#137a3d}
  .tag-pendente{background:#fdf1d6;color:#8a6d1f}
  .tag-suspenso{background:#eee;color:#555}
  .tag-rejeitado{background:#fbe0e0;color:#b02a2a}
  .tag-pago{background:#dff3e6;color:#137a3d}
  .filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .filtros>div{min-width:170px}
  .vazio{padding:22px;text-align:center;color:var(--suave);font-size:13px}
  .destaque{background:#1a0810;color:#fff;border-radius:10px;padding:16px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .destaque .valor{font-size:26px;font-weight:700}
  .destaque .rot{font-size:12.5px;opacity:.85}
  .msg{padding:10px 12px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
  .msg-erro{background:#fbe0e0;color:#8f2020;display:block}
  .msg-ok{background:#dff3e6;color:#0f5f2f;display:block}
  #telaLogin{max-width:360px;margin:70px auto}
  #painel{display:none}
  .linha-form{margin-bottom:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="telaLogin">
  <div class="card">
    <h2>Painel de Parceiros — acesso restrito</h2>
    <div class="msg" id="loginMsg"></div>
    <div class="linha-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username"/>
    </div>
    <div class="linha-form">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password"/>
    </div>
    <button class="btn-primario" style="width:100%" onclick="fazerLogin()" id="btnLogin">Entrar</button>
  </div>
</div>

<!-- ===================== PAINEL ===================== -->
<div id="painel">
  <header>
    <h1>Vínculo · Programa de Parceiros</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="quem" id="quemSou"></span>
      <button class="btn-secundario btn-mini" onclick="sair()">Sair</button>
    </div>
  </header>

  <main>
    <div class="msg" id="painelMsg"></div>

    <!-- Total a pagar + fechamento -->
    <div class="destaque">
      <div>
        <div class="rot">Total pendente de pagamento</div>
        <div class="valor" id="totalPendente">R$ 0,00</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-secundario" onclick="carregarTudo()">Atualizar</button>
        <button class="btn-primario" onclick="fecharMes()" id="btnFecharMes">Fechar comissões do mês</button>
      </div>
    </div>

    <!-- Solicitações pendentes -->
    <div class="card">
      <h2>Solicitações pendentes de aprovação</h2>
      <div id="tabelaPendentes"><div class="vazio">Carregando...</div></div>
    </div>

    <!-- Parceiros -->
    <div class="card">
      <h2>Parceiros</h2>
      <div class="filtros">
        <div>
          <label for="filtroTipo">Tipo</label>
          <select id="filtroTipo" onchange="carregarParceiros()">
            <option value="">Todos</option>
            <option value="individual">Individual</option>
            <option value="institucional">Institucional</option>
          </select>
        </div>
        <div>
          <label for="filtroStatus">Status</label>
          <select id="filtroStatus" onchange="carregarParceiros()">
            <option value="">Todos</option>
            <option value="ativo">Ativo</option>
            <option value="pendente_aprovacao">Pendente de aprovação</option>
            <option value="suspenso">Suspenso</option>
            <option value="rejeitado">Rejeitado</option>
          </select>
        </div>
      </div>
      <div id="tabelaParceiros"><div class="vazio">Carregando...</div></div>
    </div>

    <!-- Comissões -->
    <div class="card">
      <h2>Comissões</h2>
      <div class="filtros">
        <div>
          <label for="filtroPagamento">Status do pagamento</label>
          <select id="filtroPagamento" onchange="carregarComissoes()">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="pago">Pago</option>
          </select>
        </div>
        <div>
          <label for="filtroMes">Mês de referência</label>
          <select id="filtroMes" onchange="carregarComissoes()">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
      <div id="tabelaComissoes"><div class="vazio">Carregando...</div></div>
    </div>
  </main>
</div>

<script>
// Mesma origem do backend que serve esta página — funciona local e em produção
// sem precisar trocar URL na mão.
const API_URL = window.location.origin;
let token = localStorage.getItem('vinculo_admin_token') || null;

function esc(t){
  const d = document.createElement('div');
  d.textContent = t == null ? '' : String(t);
  return d.innerHTML;
}
function reais(v){
  return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
}
function dataBR(d){
  if(!d) return '—';
  const dt = new Date(d);
  return isNaN(dt) ? '—' : dt.toLocaleDateString('pt-BR');
}
function mesBR(m){
  if(!m) return '—';
  const [ano, mes] = String(m).split('-');
  return mes + '/' + ano;
}
function mostrarMsg(id, texto, tipo){
  const el = document.getElementById(id);
  el.className = 'msg ' + (tipo === 'ok' ? 'msg-ok' : 'msg-erro');
  el.textContent = texto;
  if(tipo === 'ok') setTimeout(()=>{ el.className = 'msg'; }, 4000);
}

async function api(caminho, opcoes){
  const cfg = Object.assign({ headers: {} }, opcoes || {});
  cfg.headers['Authorization'] = 'Bearer ' + token;
  if(cfg.body){ cfg.headers['Content-Type'] = 'application/json'; }
  const resp = await fetch(API_URL + caminho, cfg);
  const dados = await resp.json().catch(()=>({}));
  if(resp.status === 401 || resp.status === 403){
    // Token expirado ou usuário deixou de ser admin: volta pro login em vez
    // de deixar a tela em estado quebrado.
    sair(dados.erro || 'Acesso negado. Faça login com uma conta administradora.');
    throw new Error(dados.erro || 'Acesso negado');
  }
  if(!resp.ok) throw new Error(dados.erro || 'Erro na requisição');
  return dados;
}

// ===================== LOGIN =====================
async function fazerLogin(){
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btnLogin');
  if(!email || !senha){ mostrarMsg('loginMsg', 'Preencha e-mail e senha.', 'erro'); return; }

  btn.disabled = true;
  btn.textContent = 'Entrando...';
  try{
    const resp = await fetch(API_URL + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const dados = await resp.json();
    if(!resp.ok) throw new Error(dados.erro || 'Falha no login');

    // A checagem de admin acontece aqui só pra dar uma mensagem clara. A
    // proteção de verdade é no backend (verificarAdmin em toda rota /api/admin).
    if(!dados.usuario || !dados.usuario.is_admin){
      mostrarMsg('loginMsg', 'Acesso negado: esta conta não é administradora.', 'erro');
      return;
    }

    token = dados.token;
    localStorage.setItem('vinculo_admin_token', token);
    localStorage.setItem('vinculo_admin_nome', dados.usuario.nome || '');
    abrirPainel();
  } catch(e){
    mostrarMsg('loginMsg', e.message, 'erro');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function sair(mensagem){
  token = null;
  localStorage.removeItem('vinculo_admin_token');
  localStorage.removeItem('vinculo_admin_nome');
  document.getElementById('painel').style.display = 'none';
  document.getElementById('telaLogin').style.display = 'block';
  if(mensagem) mostrarMsg('loginMsg', mensagem, 'erro');
}

function abrirPainel(){
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
  const nome = localStorage.getItem('vinculo_admin_nome') || '';
  document.getElementById('quemSou').textContent = nome ? ('Conectado como ' + nome) : '';
  carregarTudo();
}

// ===================== CARGA =====================
async function carregarTudo(){
  await Promise.all([carregarParceiros(), carregarComissoes()]);
}

async function carregarParceiros(){
  const tipo = document.getElementById('filtroTipo').value;
  const status = document.getElementById('filtroStatus').value;
  const params = new URLSearchParams();
  if(tipo) params.set('tipo', tipo);
  if(status) params.set('status', status);

  try{
    const dados = await api('/api/admin/parceiros?' + params.toString());
    renderizarParceiros(dados.parceiros || []);
    // Pendentes vêm sempre da lista completa, independente do filtro da tabela
    // de baixo — senão filtrar por "ativo" esconderia as solicitações.
    const todos = (tipo || status) ? (await api('/api/admin/parceiros')).parceiros : dados.parceiros;
    renderizarPendentes((todos || []).filter(p => p.status === 'pendente_aprovacao'));
  } catch(e){
    document.getElementById('tabelaParceiros').innerHTML = '<div class="vazio">' + esc(e.message) + '</div>';
  }
}

function tagStatus(status){
  const mapa = {
    ativo: 'tag-ativo', pendente_aprovacao: 'tag-pendente',
    suspenso: 'tag-suspenso', rejeitado: 'tag-rejeitado',
    pago: 'tag-pago', pendente: 'tag-pendente'
  };
  const rotulos = {
    ativo: 'ativo', pendente_aprovacao: 'pendente', suspenso: 'suspenso',
    rejeitado: 'rejeitado', pago: 'pago', pendente: 'pendente'
  };
  return '<span class="tag ' + (mapa[status] || 'tag-suspenso') + '">' + esc(rotulos[status] || status) + '</span>';
}

function renderizarParceiros(lista){
  const alvo = document.getElementById('tabelaParceiros');
  if(!lista.length){ alvo.innerHTML = '<div class="vazio">Nenhum parceiro encontrado.</div>'; return; }
  alvo.innerHTML =
    '<table><thead><tr>' +
    '<th>Nome</th><th>Tipo</th><th>Código</th><th>Status</th>' +
    '<th>Indicações</th><th>Criado em</th><th></th>' +
    '</tr></thead><tbody>' +
    lista.map(p =>
      '<tr>' +
        '<td>' + esc(p.nome) + (p.nome_instituicao ? '<br/><span style="color:#6b6b73;font-size:12px">' + esc(p.nome_instituicao) + '</span>' : '') + '</td>' +
        '<td>' + esc(p.tipo) + '</td>' +
        '<td class="mono">' + esc(p.codigo_indicacao) + '</td>' +
        '<td>' + tagStatus(p.status) + '</td>' +
        '<td>' + p.indicacoes_ativas + ' ativas / ' + p.total_indicacoes + '</td>' +
        '<td>' + dataBR(p.createdAt) + '</td>' +
        '<td>' + (p.status === 'ativo'
            ? '<button class="btn-secundario btn-mini" onclick="mudarStatus(\'' + p.id + '\',\'suspenso\')">Suspender</button>'
            : (p.status === 'suspenso' || p.status === 'rejeitado'
                ? '<button class="btn-ok btn-mini" onclick="mudarStatus(\'' + p.id + '\',\'ativo\')">Reativar</button>'
                : '')) +
        '</td>' +
      '</tr>'
    ).join('') +
    '</tbody></table>';
}

function renderizarPendentes(lista){
  const alvo = document.getElementById('tabelaPendentes');
  if(!lista.length){
    alvo.innerHTML = '<div class="vazio">Nenhuma solicitação pendente no momento.</div>';
    return;
  }
  alvo.innerHTML =
    '<table><thead><tr>' +
    '<th>Nome</th><th>Instituição</th><th>Código</th><th>Solicitado em</th><th>Ações</th>' +
    '</tr></thead><tbody>' +
    lista.map(p =>
      '<tr>' +
        '<td>' + esc(p.nome) + '<br/><span style="color:#6b6b73;font-size:12px">' + esc(p.email || '') + '</span></td>' +
        '<td>' + esc(p.nome_instituicao || '—') + '</td>' +
        '<td class="mono">' + esc(p.codigo_indicacao) + '</td>' +
        '<td>' + dataBR(p.createdAt) + '</td>' +
        '<td style="display:flex;gap:8px">' +
          '<button class="btn-ok btn-mini" onclick="mudarStatus(\'' + p.id + '\',\'ativo\')">Aprovar</button>' +
          '<button class="btn-perigo btn-mini" onclick="mudarStatus(\'' + p.id + '\',\'rejeitado\')">Rejeitar</button>' +
        '</td>' +
      '</tr>'
    ).join('') +
    '</tbody></table>';
}

async function mudarStatus(id, status){
  const rotulos = { ativo: 'aprovar/reativar', rejeitado: 'rejeitar', suspenso: 'suspender' };
  if(!confirm('Confirma ' + (rotulos[status] || status) + ' este parceiro?')) return;
  try{
    await api('/api/admin/parceiros/' + id + '/status', {
      method: 'PATCH',
      body: JSON.stringify({ status })
    });
    mostrarMsg('painelMsg', 'Status atualizado com sucesso.', 'ok');
    carregarParceiros();
  } catch(e){
    mostrarMsg('painelMsg', e.message, 'erro');
  }
}

async function carregarComissoes(){
  const statusPag = document.getElementById('filtroPagamento').value;
  const mes = document.getElementById('filtroMes').value;
  const params = new URLSearchParams();
  if(statusPag) params.set('status_pagamento', statusPag);
  if(mes) params.set('mes_referencia', mes);

  try{
    const dados = await api('/api/admin/comissoes?' + params.toString());
    document.getElementById('totalPendente').textContent = reais(dados.total_pendente);
    preencherFiltroMeses(dados.meses_disponiveis || []);
    renderizarComissoes(dados.comissoes || []);
  } catch(e){
    document.getElementById('tabelaComissoes').innerHTML = '<div class="vazio">' + esc(e.message) + '</div>';
  }
}

function preencherFiltroMeses(meses){
  const sel = document.getElementById('filtroMes');
  const atual = sel.value;
  // Só remonta se a lista mudou, pra não perder a seleção do usuário a cada refresh.
  const existentes = Array.from(sel.options).slice(1).map(o => o.value);
  if(existentes.join(',') === meses.join(',')) return;
  sel.innerHTML = '<option value="">Todos</option>' +
    meses.map(m => '<option value="' + esc(m) + '">' + esc(mesBR(m)) + '</option>').join('');
  if(meses.includes(atual)) sel.value = atual;
}

function renderizarComissoes(lista){
  const alvo = document.getElementById('tabelaComissoes');
  if(!lista.length){ alvo.innerHTML = '<div class="vazio">Nenhuma comissão encontrada.</div>'; return; }
  alvo.innerHTML =
    '<table><thead><tr>' +
    '<th>Parceiro</th><th>Chave Pix</th><th>Mês</th><th>Valor</th><th>Status</th><th>Pago em</th><th></th>' +
    '</tr></thead><tbody>' +
    lista.map(c =>
      '<tr>' +
        '<td>' + esc(c.parceiro_nome) + '<br/><span class="mono" style="color:#6b6b73">' + esc(c.codigo_indicacao || '') + '</span></td>' +
        '<td class="mono">' + esc(c.chave_pix || '—') + '</td>' +
        '<td>' + esc(mesBR(c.mes_referencia)) + '</td>' +
        '<td>' + reais(c.valor) + '</td>' +
        '<td>' + tagStatus(c.status_pagamento) + '</td>' +
        '<td>' + dataBR(c.data_pagamento) + '</td>' +
        '<td>' + (c.status_pagamento === 'pendente'
          ? '<button class="btn-ok btn-mini" onclick="marcarPago(\'' + c.id + '\')">Marcar como pago</button>'
          : '') + '</td>' +
      '</tr>'
    ).join('') +
    '</tbody></table>';
}

async function marcarPago(id){
  if(!confirm('Confirmar que esta comissão foi paga? Essa ação registra a data e não deve ser desfeita pelo painel.')) return;
  try{
    await api('/api/admin/comissoes/' + id + '/marcar-pago', { method: 'PATCH' });
    mostrarMsg('painelMsg', 'Comissão marcada como paga.', 'ok');
    carregarComissoes();
  } catch(e){
    mostrarMsg('painelMsg', e.message, 'erro');
  }
}

async function fecharMes(){
  if(!confirm('Gerar as comissões do mês corrente para todas as indicações ativas?\n\nA operação é idempotente: rodar de novo não duplica comissões já criadas.')) return;
  const btn = document.getElementById('btnFecharMes');
  btn.disabled = true;
  btn.textContent = 'Processando...';
  try{
    const r = await api('/api/admin/parceiros/fechar-comissoes-mes', {
      method: 'POST',
      body: JSON.stringify({})
    });
    mostrarMsg('painelMsg',
      'Mês ' + mesBR(r.mes_referencia) + ': ' + r.criadas + ' comissão(ões) criada(s), ' +
      r.ja_existiam + ' já existia(m), ' + r.ignoradas_sem_parceiro + ' ignorada(s). ' +
      'Total gerado: ' + reais(r.valor_total) + '.', 'ok');
    carregarComissoes();
  } catch(e){
    mostrarMsg('painelMsg', e.message, 'erro');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Fechar comissões do mês';
  }
}

// Sessão salva: entra direto. Se o token não valer mais, a primeira chamada
// devolve 401/403 e o api() manda de volta pro login.
if(token) abrirPainel();
</script>
</body>
</html>
